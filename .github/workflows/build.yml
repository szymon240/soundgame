name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Set up JDK 11 (or whichever version you're using for the project)
      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin' # Or 'zulu'
          java-version: '11'

      # Set up the Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v2
        with:
          api-level: 33       # Set this to the API level your project is targeting
          build-tools-version: '33.0.0'  # Use the correct version for your project
          ndk: '23.1.7779620' # Optional, only if your project requires the NDK

      # Grant the Gradle wrapper permission to execute
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      # Build the project with Gradle
      - name: Build with Gradle
        run: ./gradlew assembleDebug

      # Optionally, run tests
      - name: Run unit tests
        run: ./gradlew test
